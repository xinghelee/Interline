<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div class="brand">
      <span class="logo">行间</span>
      <span class="brand-gloss">Interline</span>
    </div>
    <a id="settingsLink" href="#">设置</a>
  </header>

  <div id="warn" class="warn hidden">
    <span>尚未设置 API Key</span>
    <button id="openOptions" class="mini">打开设置</button>
  </div>

  <div class="actions">
    <button id="translate" class="primary">翻译此页</button>
    <div id="progressWrap" class="progress hidden">
      <div id="progressBar"></div>
    </div>
    <div class="actions-row">
      <button id="toggle" class="hidden">隐藏译文</button>
      <button id="toggleOriginal" class="hidden">仅译文</button>
      <button id="clear" class="hidden">清除</button>
    </div>
    <button id="retry" class="hidden">重试失败段落</button>
  </div>

  <label id="siteAutoRow" class="site-auto hidden">
    <span>此站点自动翻译</span>
    <input type="checkbox" id="siteAuto" />
    <span class="switch" aria-hidden="true"></span>
  </label>

  <div id="status" class="status"></div>
  <div id="usage" class="usage"></div>

  <div class="quick">
    <div class="quick-title">快捷翻译</div>
    <textarea
      id="quickInput"
      rows="2"
      placeholder="输入文本,Enter 翻译(自动中英互译)"
    ></textarea>
    <div class="quick-actions">
      <button id="quickGo">翻译</button>
    </div>
    <div id="quickResultWrap" class="quick-result-wrap hidden">
      <div id="quickResult"></div>
      <button id="quickCopy" class="mini">复制</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
