<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <span class="logo">行间</span>
    <span class="sub">Interline</span>
  </header>

  <div id="warn" class="warn hidden">
    尚未设置 API Key
    <button id="openOptions">打开设置</button>
  </div>

  <div class="actions">
    <button id="translate" class="primary">翻译此页</button>
    <button id="toggle" class="hidden">隐藏译文</button>
    <button id="toggleOriginal" class="hidden">隐藏原文(仅译文)</button>
    <button id="clear" class="hidden">清除译文</button>
  </div>

  <label id="siteAutoRow" class="site-auto hidden">
    <input type="checkbox" id="siteAuto" />
    <span>此站点自动翻译</span>
  </label>

  <div id="status" class="status"></div>
  <div id="usage" class="usage"></div>

  <div class="quick">
    <div class="quick-title">快捷翻译</div>
    <textarea
      id="quickInput"
      rows="2"
      placeholder="输入文本,Enter 翻译(自动中英互译)"
    ></textarea>
    <button id="quickGo">翻译</button>
    <div id="quickResultWrap" class="quick-result-wrap hidden">
      <div id="quickResult"></div>
      <button id="quickCopy" class="mini">复制</button>
    </div>
  </div>

  <footer><a id="settingsLink" href="#">设置</a></footer>

  <script src="popup.js"></script>
</body>
</html>
